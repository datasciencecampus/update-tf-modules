modules:
  - name: terraform-gcs-remote-state-bootstrap
    type: github
    repo: datasciencecampus/terraform-gcs-remote-state-bootstrap
    lookup: release
    pin: sha
    glob: terraform/**/*.tf
    source_prefix: git::https://github.com/datasciencecampus/terraform-gcs-remote-state-bootstrap.git?ref=
  
