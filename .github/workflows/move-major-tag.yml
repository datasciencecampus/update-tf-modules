name: Move Major Tag

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional stable release tag to map (for example v0.2.1). If omitted, uses latest release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Move major tag to released version
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ -z "${TAG:-}" || "$TAG" == "null" ]]; then
            TAG="$(
              curl -fsSL \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/releases/latest" \
              | jq -r '.tag_name'
            )"
          fi

          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "No release tag available; skipping."
            exit 0
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping non-stable SemVer tag: $TAG"
            exit 0
          fi

          MAJOR="$(echo "$TAG" | sed -E 's/^(v[0-9]+)\..*/\1/')"

          git fetch --tags origin
          git tag -f "$MAJOR" "$TAG"
          git push origin "refs/tags/$MAJOR" --force

          echo "Moved $MAJOR to $TAG"
