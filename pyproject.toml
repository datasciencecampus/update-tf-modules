[project]
name = "update-tf-modules"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Doug Lazenby", email = "douglas.lazenby@ons.gov.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
update-tf-modules = "update_tf_modules.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]
